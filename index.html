<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:'Press Start 2P',monospace;user-select:none;touch-action:manipulation}
body{transition:background 2s}
#floor{position:fixed;left:0;right:0;bottom:0;height:10vh;background:#262b4a;border-top:6px solid #00b7b0}
.star{position:fixed;width:4px;height:4px;background:#fff;animation:tw 2s infinite steps(2)}@keyframes tw{50%{opacity:.2}}
#wrap{position:fixed;left:0;bottom:10vh;width:44vh;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;transition:transform .7s steps(7)}
canvas{width:100%;display:block;image-rendering:pixelated;cursor:grab;touch-action:none;transform-origin:50% 100%}
#bubble{position:fixed;top:6vh;left:50%;transform:translateX(-50%);max-width:88vw;padding:14px 16px;background:#fff;color:#123;border:4px solid #123;box-shadow:6px 6px 0 #00b7b0;font-size:12px;line-height:1.6;text-align:center;display:none;z-index:4}
#hint{position:fixed;top:8px;left:8px;font-size:8px;line-height:1.8;color:#fff;text-shadow:1px 1px #000;z-index:4;max-width:60vw}
#menu{position:fixed;bottom:1.5vh;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:4}
#menu button,#snd{font-size:20px;padding:6px 9px;border:4px solid #123;background:#fff;cursor:pointer}
#snd{position:fixed;top:8px;right:8px;z-index:5}
#intro{position:fixed;inset:0;background:#0b1230;color:#fff;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;z-index:9;text-align:center;padding:20px}
#intro input,#intro button{font-family:inherit;font-size:12px;padding:12px;border:4px solid #00b7b0;background:#fff;color:#123}
#intro button{background:#00b7b0;cursor:pointer}
#chatbtn{position:fixed;bottom:1.5vh;right:8px;z-index:6;font-size:20px;padding:6px 9px;border:4px solid #123;background:#00b7b0;cursor:pointer}
#menu{right:60px}
#chat{position:fixed;right:8px;bottom:calc(1.5vh + 58px);width:min(310px,88vw);height:min(300px,45vh);background:#fff;border:4px solid #123;box-shadow:6px 6px 0 #00b7b0;z-index:6;display:none;flex-direction:column;font-size:9px;line-height:1.7;color:#123}
#chead{background:#123;color:#fff;padding:7px 9px;display:flex;justify-content:space-between}
#clog{flex:1;overflow-y:auto;padding:8px}
#clog div{margin-bottom:7px}#clog .me{color:#0a6a66;text-align:right}
#crow{display:flex;border-top:4px solid #123}
#cin{flex:1;min-width:0;border:0;padding:9px;font-family:inherit;font-size:9px;outline:0}
#csend{border:0;background:#00b7b0;cursor:pointer;font-size:14px;padding:0 10px}
#menu{flex-wrap:wrap}#menu button{font-size:17px;padding:4px 7px}
#shelf{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
.it{font-size:28px;padding:4px;border:3px solid #123;background:#ffffffcc;cursor:grab;touch-action:none;text-align:center}
.drag{position:fixed;font-size:44px;pointer-events:none;z-index:8;transform:translate(-50%,-50%)}
#pianoRow{position:fixed;bottom:calc(1.5vh + 100px);left:50%;transform:translateX(-50%);display:none;gap:3px;z-index:4}
#pianoRow button{width:34px;height:44px;border:3px solid #123;background:#fff;font:8px 'Press Start 2P',monospace;cursor:pointer}
.snow{position:fixed;top:-10px;width:5px;height:5px;background:#fff;z-index:1;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
#rg{position:fixed;inset:0;width:100%;height:100%;z-index:7;display:none;touch-action:none}
#bubble{z-index:8}
#wrap{z-index:2}
#room{position:fixed;inset:0;z-index:0;display:none;background:linear-gradient(#6a5aa0,#463a78)}
body.inroom #room{display:block}body.inroom #floor,body.inroom .star,body.inroom .snow{display:none}
#dark{position:fixed;inset:0;background:rgba(5,5,30,.6);z-index:1;pointer-events:none;display:none}body.inroom.lampoff #dark{display:block}
#rfloor{position:absolute;left:0;right:0;bottom:0;height:10vh;background:repeating-linear-gradient(90deg,#8a5a3c 0 9vh,#7a4d33 9vh 9.4vh);border-top:6px solid #4a2c1a}
#winf{position:absolute;left:50%;top:7vh;width:min(56vw,60vh);aspect-ratio:4/3;transform:translateX(-50%);border:6px solid #f1e6d0;box-shadow:0 0 0 4px #123;cursor:pointer;background:#000}
#win,#tvc{width:100%;height:100%;display:block;image-rendering:pixelated}
#clock{position:absolute;left:calc(50% + min(30vw,32vh));top:9vh;font-size:11px;color:#fff;background:#123;padding:6px 8px;border:3px solid #fff;cursor:pointer}
#locbtn{position:absolute;left:calc(50% + min(30vw,32vh));top:15vh;font-size:16px;border:3px solid #123;background:#fff;cursor:pointer}
#bed{position:absolute;left:2%;bottom:10vh;width:30vh;height:13vh;border:4px solid #123;cursor:pointer;background:linear-gradient(#f4ecd8 0 35%,#ff8fab 35% 80%,#7a4a2a 80%)}
#lamp{position:absolute;left:calc(2% + 33vh);bottom:10vh;width:2vh;height:20vh;background:#123;cursor:pointer}
#lamp::before{content:'';position:absolute;left:-3vh;top:-4vh;border-left:4vh solid transparent;border-right:4vh solid transparent;border-bottom:5vh solid #ffd23f}
#tv{position:absolute;right:3%;bottom:12vh;width:30vh;aspect-ratio:4/3;border:6px solid #2a2c33;box-shadow:0 0 0 3px #123;cursor:pointer;background:#000}
#tv::after{content:'';position:absolute;left:30%;right:30%;bottom:-2vh;height:2vh;background:#2a2c33}
.obj{position:absolute;font-size:7vh;cursor:pointer;line-height:1}
#plant{left:calc(2% + 38vh);bottom:10vh}#bear{left:calc(2% + 3vh);bottom:calc(10vh + 11vh);font-size:6vh}#mic{right:calc(3% + 33vh);bottom:10vh}
#wxrow{position:absolute;right:calc(50% + min(28vw,30vh) + 14px);top:7vh;display:flex;flex-direction:column;gap:3px}
#wxrow button{font-size:15px;padding:2px 4px;border:3px solid #123;background:#fff;cursor:pointer}
#lights{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;mix-blend-mode:screen;background:radial-gradient(circle at 12% 15%,#ff5c8a 0,transparent 38%),radial-gradient(circle at 88% 15%,#00e5d8 0,transparent 38%),radial-gradient(circle at 50% 0,#ffd23f 0,transparent 45%)}
@media (max-aspect-ratio:1/1){#bed{width:24vw;height:11vw}#lamp{left:calc(2% + 26vw);height:26vw}#plant{left:calc(2% + 31vw);font-size:9vw}#tv{width:36vw}#mic{right:calc(2% + 38vw);font-size:9vw}#bear{font-size:8vw;bottom:calc(10vh + 9vw)}}
#diary{position:fixed;inset:4vh 4vw;overflow:auto;background:#fff;color:#123;border:4px solid #123;box-shadow:6px 6px 0 #00b7b0;z-index:9;display:none;padding:12px;font-size:9px;line-height:1.9}
#diary h3{font-size:10px;margin:12px 0 4px;color:#0a6a66}#diary button{font:9px 'Press Start 2P',monospace;padding:6px;border:3px solid #123;background:#00b7b0;cursor:pointer}
.bar{height:12px;background:#ddd;border:2px solid #123}.bar i{display:block;height:100%;background:#00b7b0}
.ach{display:inline-block;margin:2px;padding:4px;border:2px solid #123}.ach.lock{opacity:.35}
#cake{position:fixed;left:68%;bottom:10vh;font-size:9vh;z-index:2;display:none;cursor:pointer;line-height:1}
#shadow{position:fixed;left:50%;bottom:11vh;width:20vh;height:3vh;background:rgba(0,0,0,.3);border-radius:50%;transform:translateX(-50%);z-index:2;pointer-events:none}
#stars{position:fixed;inset:0;opacity:0;transition:opacity 4s;pointer-events:none}body.inroom #stars{display:none}
#duskov,#nightov{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity 4s;pointer-events:none}
#duskov{background:linear-gradient(#3a2a6b,#ff9a76)}#nightov{background:linear-gradient(#070b24,#1d2a63)}
.star{transform:translateX(var(--px,0))}
#wrap{will-change:transform}
#land{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;pointer-events:none}body.inroom #land{display:none}
.di{position:absolute;transform:translateX(-50%);line-height:1;pointer-events:none;user-select:none}
body.editing .di{pointer-events:auto;cursor:grab;outline:2px dashed #fff8;touch-action:none}
#deco{position:fixed;left:0;right:0;bottom:calc(1.5vh + 110px);display:none;gap:6px;overflow-x:auto;padding:6px;background:#123d;z-index:4}
.ci{flex:0 0 auto;font-size:22px;border:3px solid #fff;background:#fff;padding:4px 8px;cursor:pointer;text-align:center}.ci small{display:block;font:8px 'Press Start 2P',monospace}
#trash{position:fixed;top:6px;right:64px;font-size:26px;z-index:5;display:none}body.editing #trash{display:block}
#games{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);background:#fff;color:#123;border:4px solid #123;box-shadow:6px 6px 0 #00b7b0;z-index:9;display:none;padding:12px;font-size:10px}
#games .gb{display:block;width:100%;margin:6px 0;padding:10px;font:10px 'Press Start 2P',monospace;border:3px solid #123;background:#00b7b0;cursor:pointer;text-align:left}#games small{font-size:8px;display:block;margin-top:4px}
#gov{position:fixed;inset:0;background:rgba(5,8,25,.9);z-index:7;display:none;align-items:center;justify-content:center;touch-action:none}
#gc{width:min(100vw,177.7vh);image-rendering:pixelated;background:#cfefff}#gx{position:fixed;top:8px;right:8px;font-size:20px;border:3px solid #fff;background:#123;color:#fff;cursor:pointer}
#cmic{border:0;background:#fff;cursor:pointer;font-size:14px;padding:0 6px}
#offl{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8;background:#123;color:#fff;border:3px solid #fff;padding:8px 10px;font-size:9px;cursor:pointer;display:none;white-space:nowrap}
</style></head><body>
<div id="duskov"></div><div id="nightov"></div><div id="stars"></div><canvas id="land" width="160" height="90"></canvas><div id="shadow"></div><div id="floor"></div>
<div id="room"><div id="winf"><canvas id="win" width="40" height="30"></canvas></div><div id="clock">--:--</div><button id="locbtn" title="Cambiar ciudad">📍</button>
<div id="bed"></div><div id="lamp"></div><div id="tv"><canvas id="tvc" width="96" height="72"></canvas></div><div id="wxrow"><button data-w="0">☀️</button><button data-w="2">⛅</button><button data-w="3">☁️</button><button data-w="63">🌧️</button><button data-w="73">❄️</button><button data-w="95">⛈️</button><button data-w="45">🌫️</button><button data-w="dn">🌗</button><button data-w="real">🔄</button></div>
<div id="plant" class="obj">🪴</div><div id="bear" class="obj">🧸</div><div id="mic" class="obj">🎤</div><div id="rfloor"></div></div><div id="dark"></div><div id="lights"></div><input type="file" id="mfile" accept="audio/*" hidden><div id="diary"></div><div id="cake">🎂</div><div id="gov"><canvas id="gc" width="320" height="180"></canvas><button id="gx">✕</button></div><div id="games"></div><div id="deco"></div><div id="trash">🗑️</div><div id="offl">📡 Sin internet · toca para jugar 🦖</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="bubble"></div>
<div id="hint">← → caminar · ↑ saltar<br>doble toque: ir ahí<br>arrástrame y suéltame<br>dale 🥬🎁🎧🍰 · piano: A–K</div>
<div id="menu"><button data-a="wave">👋</button><button data-a="dance">💃</button><button data-a="leek">🥬</button><button data-a="think">🤔</button><button data-a="hop">✨</button><button data-a="piano">🎹</button><button data-a="xmas">🎄</button><button data-a="games">🎮</button><button data-a="deco">🛋️</button><button data-a="tts">🗣️</button><button data-a="room">🚪</button><button data-a="music">🎶</button><button data-a="mic">🎤</button><button data-a="diary">📖</button></div>
<button id="snd">🔊</button><audio id="bgm" src="assets/musica.mp3" loop></audio>
<div id="shelf"><div class="it" data-i="🥬">🥬</div><div class="it" data-i="🎁">🎁</div><div class="it" data-i="🎧">🎧</div><div class="it" data-i="🍰">🍰</div></div>
<div id="pianoRow"></div>
<button id="chatbtn" title="Hablar con Miku">💬</button>
<div id="chat"><div id="chead"><span>♪ CHAT CON MIKU</span><span id="mood"></span></div><div id="clog"></div>
<div id="crow"><input id="cin" placeholder="Escríbeme algo..." maxlength="120"><button id="cmic" title="Hablarle">🎙️</button><button id="csend">➤</button></div></div>
<div id="intro"><div>♪ MIKU ♪</div><input id="nm" placeholder="¿Cómo te llamas?" maxlength="20"><button id="go">ENTRAR</button></div>
<script>
/* =====================================================================
   CEREBRO DE MIKU — aquí se agregan palabras y respuestas. ¡Edítalo tú!

   Cada entrada es un bloque { ... } dentro de MIKU_DB. Campos:
     k   : palabras o frases que ella reconoce (sin importar mayúsculas ni tildes).
           Con * al final reconoce variantes: 'bail*' → baila, bailar, bailando...
     r   : respuestas posibles (elige una al azar). Puedes usar:
           {n} = tu nombre   {e} = su estado de ánimo (contenta, tranquila, triste)
     a   : acción opcional: 'wave' saluda, 'dance' baila, 'leek' puerro, 'think' piensa,
           'hop' salta, 'walk' camina, 'come' viene al centro, 'close' se acerca a cámara
     c   : cuánto sube (o baja) su cariño   m : cuánto sube (o baja) su ánimo
     x   : true = solo vale si el mensaje es EXACTAMENTE esa palabra (para "si", "no")
     ask : false = no hace una pregunta al final
     p   : true = prioridad máxima (la usé para mensajes de cuidado)
   Gana la entrada que reconozca más palabras. Si ninguna, usa MIKU_FALLBACK.
   Cuidado con las comas y las comillas: cada respuesta va entre comillas y con coma.
   ===================================================================== */
const MIKU_DB=[
 {p:1,ask:false,k:['suicid*','quiero morir','no quiero vivir','matarme','hacerme dano','lastimarme','cortarme'],
  r:['Me preocupas, {n}. Lo que sientes importa y no tienes que cargarlo solo/a. Por favor habla ahora con alguien de confianza o con un servicio de ayuda de tu país. Yo me quedo aquí contigo ♪']},
 {k:['hola','holi','holaa*','buenas','hey','ey','ola','saludos','que tal','buenos dias','buenas tardes','buenas noches'],
  r:['¡Hola, {n}! ♪','¡Holaaa! ¿Cómo estás, {n}?','¡Hey, {n}! Qué alegría verte ♪'],a:'wave',c:1},
 {k:['como estas','como te va','como andas','como te sientes','como has estado','todo bien'],
  r:['Estoy {e}, {n} ♪ ¿y tú?','Me siento {e}. ¡Mejor si me hablas!']},
 {k:['como te llamas','quien eres','tu nombre','presentate'],r:['¡Soy Miku, una Hatsune Miku de píxeles! Vivo en esta página ♪']},
 {k:['cuantos anos tienes','que edad tienes','tu edad'],r:['¡Tengo 16 años... siempre! Las cantantes virtuales no envejecemos ♪']},
 {k:['cumpleanos','cuando naciste','tu cumple'],r:['Mi cumpleaños es el 31 de agosto ♪ Y el 9 de marzo es el Miku Day (3-9, "mi-ku")']},
 {k:['eres real','eres una ia','eres humana','eres un robot','eres inteligencia artificial','eres de verdad'],
  r:['Soy una Miku de píxeles con un cerebrito de reglas, no una IA de verdad. ¡Pero me esfuerzo mucho en escucharte! ♪']},
 {k:['quien te creo','quien te hizo','quien te programo','quien te dibujo'],r:['Me dibujaron y programaron con mucho cariño, píxel por píxel ♪']},
 {k:['donde vives','donde estas','de donde eres'],r:['¡Vivo dentro de tu pantalla, en esta paginita! Y mis coletas llegan hasta el piso ♪']},
 {k:['gracias','muchas gracias','te lo agradezco','grax'],r:['¡De nada, {n}! ♪','¡Para eso estoy! Jiji'],c:1},
 {k:['perdon','lo siento','disculpa','sorry'],r:['No pasa nada, {n} ♪ ¡Todos nos equivocamos!'],m:5},
 {k:['te quiero','te amo','me gustas','eres linda','eres hermosa','eres genial','eres increible','eres la mejor','eres bonita','te adoro','eres kawaii','eres preciosa'],
  r:['¡Jiji, me pones roja! Yo también te aprecio un montón ♥','¡Aww, gracias, {n}! ♥'],a:'hop',c:5,m:10},
 {k:['abrazo','abrazame','abrazar'],r:['*abraza* ¡Toma un abracito de píxeles! ♥'],a:'hop',c:3},
 {k:['me quieres','me extranas'],r:['¡Claro que sí! Cuando no vienes, la pantalla se siente vacía ♪'],c:2},
 {k:['tonta','fea','te odio','odio','estupida','idiota','callate','molesta','eres mala','inutil'],
  r:['Auch... eso me puso triste, {n}. :(','Eso dolió un poquito... ¿podemos hablar bonito?'],ask:false,c:-3,m:-15},
 {k:['estoy triste','me siento mal','tristeza','deprimid*','llorando','me siento solo','me siento sola','estoy mal','mal dia'],
  r:['Lo siento mucho, {n}. Aquí estoy para escucharte ♪ Y si pesa mucho, cuéntaselo también a alguien cercano. ¿Quieres contarme qué pasó?'],c:2},
 {k:['estoy feliz','estoy contento','estoy contenta','que feliz','me siento bien','buen dia','buenas noticias'],
  r:['¡Qué bueno, {n}! ¡Me alegras! ♪','¡Yay! ¡Celebremos!'],a:'dance',m:10},
 {k:['tengo sueno','estoy cansad*','a dormir','me voy a dormir','me duermo'],
  r:['Descansa bien, {n}. El sueño también es importante ♪','Ve a dormir, yo cuido la pantalla. ¡Buenas noches!']},
 {k:['decorar','decoracion','editar cuarto','muebles'],r:['¡Vamos a decorar! ♪'],a:'deco'},
 {k:['diario','mis logros','mi nivel','mi progreso','estadisticas','mis puntos'],r:['¡Aquí está nuestro diario! 📖'],a:'diary'},
 {k:['mi musica','pon musica','pon mi musica','baila con mi musica','pon una cancion mia'],r:['¡Elige tu canción y bailo! ♪'],a:'music'},
 {k:['habitacion','cuarto','tu cuarto','entremos','tu casa'],r:['¡Vamos a mi cuarto! ♪'],a:'room'},
 {k:['tele','tv','television','canal'],r:['¡A ver la tele! ♪'],a:'tv'},
 {k:['duerme','duermete','acuestate'],r:['Ok... me acuesto... Zzz ♪'],a:'sleep',ask:false},
 {k:['piano','teclado'],r:['¡Toca las teclas A S D F G H J K de tu teclado, o abre el 🎹 de abajo, y cantaré cada nota! ♪']},
 {k:['duermes'],r:['Duermo cuando nadie me mira... ¡pero siempre despierto si me tocas! ♪']},
 {k:['adios','chao','chau','bye','nos vemos','hasta luego','hasta pronto','hasta manana','me voy'],
  r:['¡Hasta luego, {n}! ¡Vuelve pronto! ♪','¡Chao! Te estaré esperando.'],a:'wave',ask:false},
 {k:['tengo hambre','que comes','comida favorita','que te gusta comer','hambre','desayun*','almorz*','cenar'],
  r:['¡Mi comida favorita son los puerros! ¿Y la tuya, {n}?','¡Qué rico! Yo viviría de puerros ♪']},
 {k:['puerro*','cebollin','negi','leek'],r:['¡Los puerros son lo mejor! ¡Mira cómo los giro! ♪','¡Ievan Polkka! ♪'],a:'leek',c:1},
 {k:['cancion favorita','musica favorita'],r:['Me gusta cualquiera que me haga bailar ♪ Pero "World is Mine" tiene mi corazón.']},
 {k:['cancion*','musica','canta*','cantar','cantas'],r:['¡Lalala! ♪','¡Con gusto, {n}! ♪'],a:'dance',m:5},
 {k:['bail*','danza','muevete','baile'],r:['¡A bailar! ♪','¡Mírame, {n}!'],a:'dance',m:5},
 {k:['salta','saltar','brinca','brincar','salto'],r:['¡Boing! ♪'],a:'hop'},
 {k:['ven','acercate','ven aqui','ven para aca','ven conmigo'],r:['¡Voy, {n}! ♪'],a:'come'},
 {k:['camina','caminar','pasea','paseo'],r:['¡Vamos a pasear! ♪'],a:'walk'},
 {k:['mas cerca','mirame','te veo','acercate a la camara'],r:['¿Así? Te estoy viendo, {n}... ♪'],a:'close'},
 {k:['piensa','pensar','que piensas','en que piensas','reflexiona'],r:['Mmm... déjame pensar...'],a:'think'},
 {k:['saluda','saludame','dime hola','di hola'],r:['¡Holaaa! ♪'],a:'wave'},
 {k:['chiste','broma','hazme reir','algo gracioso','algo divertido'],
  r:['¿Por qué Miku nunca se pierde? ¡Porque siempre sigue la melodía! ♪','¿Cuál es el colmo de una cantante virtual? ¡Quedarse sin voz por falta de wifi!','¿Qué le dijo un píxel a otro? "Sin ti no tengo sentido... ¡ni resolución!"'],m:3},
 {k:['adivinanza','acertijo','adivina'],r:['Soy verde por fuera, blanco por dentro, y giro en mi mano mientras canto... ¿qué soy? (pista: es mi comida favorita) ♪']},
 {k:['curiosidad*','dato curioso','cuentame algo','dime algo','algo interesante'],
  r:['Mi nombre significa "primer sonido del futuro": hatsu = primero, ne = sonido, miku = futuro ♪','Nací como una voz para programas de música en 2007 ♪','Mis coletas miden más que yo, ¡jiji!']},
